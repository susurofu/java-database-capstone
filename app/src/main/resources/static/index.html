<!-- index.html -->

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <title>Select Role</title>

    <!-- Favicon -->
    <link
        rel="icon"
        type="image/png"
        href="./assets/images/logo/Logo.png"
    />

    <!-- Stylesheets -->
    <link
        rel="stylesheet"
        href="./assets/css/index.css"
    />

    <link
        rel="stylesheet"
        href="./assets/css/style.css"
    />

    <!-- Utility JavaScript -->
    <script
        src="./js/util.js"
        defer>
    </script>

    <script
        src="./js/render.js"
        defer>
    </script>

    <!-- Components -->
    <script
        src="./js/components/header.js"
        defer>
    </script>

    <script
        src="./js/components/footer.js"
        defer>
    </script>
</head>


<body>

    <div class="container">

        <div class="wrapper">

            <!-- Header rendered dynamically -->
            <div id="header"></div>


            <!-- Main Content -->
            <main class="main-content">

                <h2>Select Your Role</h2>

                <div class="role-buttons">

                    <button
                        id="admin"
                        class="role-button"
                        onclick="selectRole('admin')">
                        Admin
                    </button>

                    <button
                        id="doctor"
                        class="role-button"
                        onclick="selectRole('doctor')">
                        Doctor
                    </button>

                    <button
                        id="patient"
                        class="role-button"
                        onclick="selectRole('patient')">
                        Patient
                    </button>

                </div>

            </main>


            <!-- Footer rendered dynamically -->
            <div id="footer"></div>

        </div>

    </div>


    <!-- Login Modal -->
    <div
        id="modal"
        class="modal"
        style="display: none;">

        <div class="modal-content">

            <!-- Close Modal Button -->
            <span
                id="closeModal"
                class="close">
                &times;
            </span>

            <!-- Dynamic modal content -->
            <div id="modal-body"></div>

        </div>

    </div>


    <!-- Page-specific JavaScript -->
    <script
        type="module"
        src="./js/services/index.js">
    </script>

</body>

</html>
